# 发版：打 tag（v 加上 Cargo.toml、package.toml 里的版本）就照官方的打包模板一种系统打一个包文件，传进这个 tag 的 Release。
# 软件源每天收一次，收进索引以后 `miyu pkg install embed` 就装得上。模型文件取本仓库的 Release
# models-granite-embedding-97m-multilingual-r2，照 SHA256SUMS 核对。
name: release

on:
  push:
    tags: ["v*"]

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    uses: miyu-agent/packages/.github/workflows/pack.yml@main
    permissions:
      contents: write
    with:
      package: embed
      folder: package/embed
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.os }}
      build: |
        set -euo pipefail
        rustup toolchain install
        cargo build --release --locked
        exe=""
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
        mkdir -p package/embed/bin
        cp "target/release/miyu-embed$exe" package/embed/bin/
        base=https://github.com/miyu-agent/miyu-embed/releases/download/models-granite-embedding-97m-multilingual-r2
        for name in model_q4.onnx vocab.txt merges.txt LICENSE NOTICE SHA256SUMS; do
          curl -fsSL --retry 3 -o "package/embed/$name" "$base/$name"
        done
        cd package/embed
        if command -v sha256sum > /dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
        rm SHA256SUMS
