[package]
name = "miyu-embed"
description = "Miyu 的内置语义模型：照清单读一份模型，一行一句话进、一行一个向量出（核心仓库施工 R-5 上，S-7 拆出来）"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false
autotests = false

[[bin]]
name = "miyu-embed"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
# 跑模型（施工 R-5 上）：ONNX Runtime 的 Rust 封装，钉死版本（还是 RC）。只开这三样：编译时下 pyke 预编好的静态库、静态
# 链接，主程序不带；`tls-rustls` 是下载那一步用的。MIT OR Apache-2.0；ONNX Runtime 本身 MIT（`licenses.md`）。
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
# 协议一行一个 JSON：请求照 `serde_json` 读，回应照 serde 写。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 字节级 BPE 切段的正则要往前看（`\s+(?!\S)`，`bpe.rs`），`regex` 不支持（施工 R-5 六补）。MIT；`regex-automata`、
# `regex-syntax` 原来就有，多一个 `bit-set`（MIT OR Apache-2.0）。
fancy-regex = "0.16"
# 清单的类型（施工 R-5 中挪过去的，`miyu_recall::embedding`）：核心也照它读，两边一份。
miyu-recall = { git = "https://github.com/miyu-agent/miyu", rev = "9c287842826ae00b4b6680e55f5dd912374f353b" }

[dev-dependencies]
# 包的清单照核心的读法查（tests/package.rs）。
miyu-config = { git = "https://github.com/miyu-agent/miyu", rev = "9c287842826ae00b4b6680e55f5dd912374f353b" }

# 同核心（核心仓库根目录的 Cargo.toml）。
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
let_underscore_must_use = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# 发出去的：整个程序一起优化、一份代码单元（同核心）。
[profile.release]
lto = "fat"
codegen-units = 1
